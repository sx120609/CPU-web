plugins {
    id "com.android.application"
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}

def defaultAppUrl = "https://cpu.lizmt.cn/schedule"
def resolvedAppUrl = (project.findProperty("appUrl") ?: defaultAppUrl).toString()
def resolvedApplicationId = (project.findProperty("applicationId") ?: "cn.lizmt.cpuweb.schedule").toString()
def resolvedAppName = (project.findProperty("appName") ?: "药大拾间").toString()

def escapeJavaString = { value ->
    value.replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace "cn.lizmt.cpuweb.schedule"
    compileSdk 35

    defaultConfig {
        applicationId resolvedApplicationId
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName "2.1.0"

        buildConfigField "String", "APP_URL", "\"${escapeJavaString(resolvedAppUrl)}\""
        resValue "string", "app_name", resolvedAppName
    }

    buildFeatures {
        buildConfig true
    }
}
