name: Desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/package.json", ".github/workflows/desktop-release.yml"]
    tags:
      - "desktop-v*"

permissions:
  contents: write
  actions: read

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundled Wisdom Tree worker
        run: |
          python -m pip install -r ../server/python/zhihuishu/requirements-lock.txt pyinstaller==6.16.0
          python -m unittest discover -s ../server/python/zhihuishu -p test_worker.py
          python scripts/build-zhihuishu-worker.py

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Wisdom Tree desktop IPC smoke test
        run: npm run test:zhihuishu

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify packaged resources and checksum
        shell: pwsh
        run: |
          node scripts/package-check.cjs
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash.ToLower()) *$($installer.Name)" |
            Set-Content -Encoding utf8 release/SHA256SUMS-windows.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS-windows.txt
          compression-level: 0
          if-no-files-found: error

  macos:
    name: Build Apple Silicon macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundled Wisdom Tree worker
        run: |
          python -m pip install -r ../server/python/zhihuishu/requirements-lock.txt pyinstaller==6.16.0
          python -m unittest discover -s ../server/python/zhihuishu -p test_worker.py
          python scripts/build-zhihuishu-worker.py

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Wisdom Tree desktop IPC smoke test
        run: npm run test:zhihuishu

      - name: Apple Silicon runtime smoke test
        run: npm run test:smoke

      - name: Build arm64 DMG and ZIP
        run: npm run dist:mac:arm64

      - name: Verify architecture, signature, and packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          file "$executable" | tee release/mac-arm64-architecture.txt
          file "$executable" | grep -q "arm64"
          if file "$executable" | grep -q "x86_64"; then
            echo "产物意外包含 Intel 架构" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          node scripts/package-check.cjs "$app_path/Contents/Resources/app.asar"
          shasum -a 256 release/*.dmg release/*.zip | tee release/SHA256SUMS-macos.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS-macos.txt
            desktop/release/mac-arm64-architecture.txt
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish unified GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "desktop-v$version" ]]; then
            echo "Tag and desktop version disagree" >&2
            exit 1
          fi
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          echo "DESKTOP_TAG=desktop-v$version" >> "$GITHUB_ENV"

      - name: Require exact-commit Linux production artifact
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            run_id="$(jq -r '[.workflow_runs[] | select(.name == "Linux deployment artifact" and .head_sha == env.GITHUB_SHA)] | sort_by(.id) | last | .id // empty' <<< "$runs")"
            if [[ -n "$run_id" ]]; then
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // "pending"' <<< "$runs")"
              if [[ "$conclusion" == success ]]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' | grep -F "$GITHUB_SHA"
                exit 0
              fi
              if [[ "$conclusion" != pending ]]; then echo "Linux build failed: $conclusion"; exit 1; fi
            fi
            sleep 20
          done
          echo "Linux production artifact not ready" >&2
          exit 1

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: artifacts/macos

      - name: Prepare stable release asset names
        shell: bash
        run: |
          set -euo pipefail
          version="$DESKTOP_VERSION"
          windows_installer="$(find artifacts/windows -maxdepth 1 -name '*.exe' -print -quit)"
          mac_dmg="$(find artifacts/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          mac_zip="$(find artifacts/macos -maxdepth 1 -name '*.zip' -print -quit)"
          mac_architecture="$(find artifacts/macos -maxdepth 1 -name 'mac-arm64-architecture.txt' -print -quit)"
          test -n "$windows_installer"
          test -n "$mac_dmg"
          test -n "$mac_zip"
          test -n "$mac_architecture"
          mkdir -p release-assets
          cp "$windows_installer" "release-assets/CPU-Web-Desktop-${version}-win-x64-installer.exe"
          cp "$mac_dmg" "release-assets/CPU-Web-Desktop-${version}-mac-arm64.dmg"
          cp "$mac_zip" "release-assets/CPU-Web-Desktop-${version}-mac-arm64.zip"
          cp "$mac_architecture" release-assets/mac-arm64-architecture.txt
          (
            cd release-assets
            sha256sum CPU-Web-Desktop-* > SHA256SUMS.txt
          )

      - name: Write release notes
        shell: bash
        run: |
          version="$DESKTOP_VERSION"
          cat > release-notes.md <<'EOF'
          ## 药大拾间桌面端 __VERSION__

          ### 本次更新

          - 修复 Windows 任务栏上药大拾间显示为空白文档图标的问题；更新后的快捷方式与任务栏使用同一个应用标识，通知也归到药大拾间名下。
          - 修复工具页“网课助手 → 平台账号密码”里记住密码开关显示不全、点不到的问题。
          - 已开启开机自启的用户，设置保持不变，仍可随时在“启动与后台”里关闭。

          ### 下载

          - **Windows 10 / 11（64 位）**：下载 `CPU-Web-Desktop-__VERSION__-win-x64-installer.exe`。
          - **Apple Silicon macOS**：下载 `CPU-Web-Desktop-__VERSION__-mac-arm64.dmg`；仅支持 M 系列芯片，不支持 Intel Mac。

          ### 首次安装提示

          Windows 下载时若 Edge 显示“通常不会下载”，请在下载列表中点击安装包右侧的下拉箭头，依次选择“保留”与“仍然保留”。运行时若 SmartScreen 拦截，请选择“更多信息”与“仍要运行”。

          macOS 当前未使用 Apple Developer ID 公证。首次打开被拦截时，请前往“系统设置 → 隐私与安全性”，找到本应用并选择“仍要打开”。

          发布页同时附有 SHA-256 校验文件和 macOS 架构验证记录。
          EOF
          sed -i "s/__VERSION__/$version/g" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$DESKTOP_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "药大拾间桌面端 $DESKTOP_VERSION" \
            --notes-file release-notes.md
