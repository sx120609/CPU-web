name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify packaged resources and checksum
        shell: pwsh
        run: |
          node scripts/package-check.cjs
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash.ToLower()) *$($installer.Name)" |
            Set-Content -Encoding utf8 release/SHA256SUMS-windows.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS-windows.txt
          compression-level: 0
          if-no-files-found: error

  macos:
    name: Build Apple Silicon macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Apple Silicon runtime smoke test
        run: npm run test:smoke

      - name: Build arm64 DMG and ZIP
        run: npm run dist:mac:arm64

      - name: Verify architecture, signature, and packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          file "$executable" | tee release/mac-arm64-architecture.txt
          file "$executable" | grep -q "arm64"
          if file "$executable" | grep -q "x86_64"; then
            echo "产物意外包含 Intel 架构" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          node scripts/package-check.cjs "$app_path/Contents/Resources/app.asar"
          shasum -a 256 release/*.dmg release/*.zip | tee release/SHA256SUMS-macos.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS-macos.txt
            desktop/release/mac-arm64-architecture.txt
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish unified GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: artifacts/macos

      - name: Prepare stable release asset names
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          windows_installer="$(find artifacts/windows -maxdepth 1 -name '*.exe' -print -quit)"
          mac_dmg="$(find artifacts/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          mac_zip="$(find artifacts/macos -maxdepth 1 -name '*.zip' -print -quit)"
          mac_architecture="$(find artifacts/macos -maxdepth 1 -name 'mac-arm64-architecture.txt' -print -quit)"
          test -n "$windows_installer"
          test -n "$mac_dmg"
          test -n "$mac_zip"
          test -n "$mac_architecture"
          mkdir -p release-assets
          cp "$windows_installer" "release-assets/CPU-Web-Desktop-${version}-win-x64-installer.exe"
          cp "$mac_dmg" "release-assets/CPU-Web-Desktop-${version}-mac-arm64.dmg"
          cp "$mac_zip" "release-assets/CPU-Web-Desktop-${version}-mac-arm64.zip"
          cp "$mac_architecture" release-assets/mac-arm64-architecture.txt
          (
            cd release-assets
            sha256sum CPU-Web-Desktop-* > SHA256SUMS.txt
          )

      - name: Write release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          cat > release-notes.md <<'EOF'
          ## 药大拾间桌面端 __VERSION__

          ### 本次更新

          - 学习通助手更新到 2.2.13：章节测验关闭自动提交时会先点击“暂时保存”，再停在页面等待检查和手动交卷；全部题目都获得答案后才允许自动提交。
          - 工具页删除正确率阈值、切章等待与提交前等待等冗余设置，仅保留真正需要调整的每题间隔。
          - 隐藏的切章和提交等待统一采用稳妥默认值，历史配置不会继续影响新版行为。
          - Windows 退出时不再触发更新安装和自动重启；已下载更新会留到下次主动启动客户端时安装。

          ### 下载

          - **Windows 10/11 64 位**：下载 `CPU-Web-Desktop-__VERSION__-win-x64-installer.exe`。
          - **Apple Silicon Mac**：下载 `CPU-Web-Desktop-__VERSION__-mac-arm64.dmg`，仅支持 M1/M2/M3/M4 及后续 M 系列，不支持 Intel Mac。

          ### 首次安装提示

          Windows 若提示“未知发布者”，点“更多信息”→“仍要运行”。macOS 当前未使用 Apple Developer ID 公证；首次打开被拦截时，请到“系统设置 → 隐私与安全性”找到本应用，点“仍要打开”，再用密码或 Touch ID 确认。

          两个平台的 SHA-256 校验文件与 macOS 架构验证记录一并附上。
          EOF
          sed -i "s/__VERSION__/$version/g" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "药大拾间桌面端 ${GITHUB_REF_NAME#desktop-v}" \
            --notes-file release-notes.md
