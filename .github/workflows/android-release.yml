name: Android release artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify update handoff and build release APK
        working-directory: android
        run: |
          bash gradlew :app:testDebugUnitTest --tests '*Apk*Test' --tests '*AppConfigTest' :app:lintDebug :app:assembleRelease --no-daemon
      - name: Upload commit-bound unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: cpu-web-android-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-web-android-checks-${{ github.sha }}
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
