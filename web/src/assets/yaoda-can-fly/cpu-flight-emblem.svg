<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">药大人能飞创意校标</title>
  <desc id="desc">以中国药科大学圆形校标结构为灵感，中心重绘为带双翼的胶囊</desc>
  <defs>
    <path id="topArc" d="M 42 113 A 80 80 0 0 1 198 113"/>
    <path id="bottomArc" d="M 34 139 A 92 92 0 0 0 206 139"/>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123f91"/>
      <stop offset=".5" stop-color="#123f91"/>
      <stop offset=".5" stop-color="#f0a51a"/>
      <stop offset="1" stop-color="#f0a51a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#102a63" flood-opacity=".22"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="112" fill="#fff" stroke="#123f91" stroke-width="8"/>
  <circle cx="120" cy="120" r="92" fill="#f8fbff" stroke="#123f91" stroke-width="2"/>
  <text fill="#123f91" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">中国药科大学</textPath>
  </text>
  <text fill="#123f91" font-family="Arial,sans-serif" font-size="8.4" font-weight="700" letter-spacing="1.1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CHINA PHARMACEUTICAL UNIVERSITY</textPath>
  </text>
  <g filter="url(#shadow)">
    <path d="M80 104C59 82 45 96 51 117c7 22 28 23 46 8" fill="#fff" stroke="#123f91" stroke-width="6" stroke-linejoin="round"/>
    <path d="M160 104c21-22 35-8 29 13-7 22-28 23-46 8" fill="#fff" stroke="#123f91" stroke-width="6" stroke-linejoin="round"/>
    <path d="M85 103h70a24 24 0 0 1 0 48H85a24 24 0 0 1 0-48Z" fill="url(#capsule)" stroke="#123f91" stroke-width="6"/>
    <path d="M120 104v46" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M111 127h18M120 118v18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="120" y="175" text-anchor="middle" fill="#123f91" font-family="Georgia,serif" font-size="15" font-weight="700" letter-spacing="3">1936</text>
  <circle cx="36" cy="120" r="3" fill="#f0a51a"/>
  <circle cx="204" cy="120" r="3" fill="#f0a51a"/>
</svg>
