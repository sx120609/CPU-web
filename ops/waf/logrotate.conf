# Run with the dedicated timer below; daily distro logrotate is too slow during floods.
/var/log/nginx/cpu-web-waf.jsonl {
    size 100M
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root adm
    sharedscripts
    postrotate
        /www/server/nginx/sbin/nginx -s reopen -c /www/server/nginx/conf/nginx.conf
    endscript
}
