# Include ONCE inside http {}, before the site server {} blocks.
# Requires nginx http_realip_module (log the TCP peer separately from the client).
# Do not trust arbitrary X-Forwarded-For. Audit existing set_real_ip_from rules first.
map $uri $cpu_waf_group {
    default other;
    # Express routes are case-insensitive by default; match normalized nginx URI likewise.
    ~*^/share/topic/ share;
}
map $cpu_waf_group $cpu_waf_share_total {
    default "";
    share "share";
}
# Example safety budgets, tune in dry-run against real campus traffic.
# The aggregate key intentionally spans all included virtual hosts/aliases.
limit_req_zone $cpu_waf_share_total zone=cpu_waf_share_total:1m rate=100r/s;
limit_conn_zone $cpu_waf_share_total zone=cpu_waf_share_total_conn:1m;
# Never key limits by source IP: thousands of campus users share one NAT address.
include /var/lib/cpu-web-waf/nginx/adaptive.conf;
limit_req_zone $cpu_waf_attack_key zone=cpu_waf_attack:1m rate=20r/s;
limit_conn_zone $cpu_waf_attack_key zone=cpu_waf_attack_conn:1m;
log_format cpu_waf escape=json
    '{"v":1,"ts":"$msec","host":"$server_name",'
    '"client":"$remote_addr","peer":"$realip_remote_addr",'
    '"group":"$cpu_waf_group","limit":"$limit_req_status"}';
