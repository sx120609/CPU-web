# Include in the intended server {}. Start in dry-run; no route/proxy changes.
# Location-level access_log/limit_req/limit_conn directives override inheritance.
# Also include this snippet in such proxy locations if needed (see runbook/tests).
limit_req zone=cpu_waf_share_total burst=100 nodelay;
limit_req zone=cpu_waf_attack burst=40 nodelay;
limit_req_status 429;
limit_req_log_level notice;
limit_req_dry_run on;
limit_conn cpu_waf_share_total_conn 100;
limit_conn cpu_waf_attack_conn 30;
limit_conn_status 429;
limit_conn_dry_run on;
# No URI, query strings, cookies, authorization, usernames or body content.
access_log /var/log/nginx/cpu-web-waf.jsonl cpu_waf buffer=64k flush=1s;
